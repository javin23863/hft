[workspace]
resolver = "2"
members = [
    "crates/mempool-core",
    "crates/mempool-ingest",
    "crates/mempool-silver",
    "crates/feasibility",
    "crates/scenario-engines",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/javin23863/hft"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
futures = "0.3"
arrow = "53"
arrow-array = "53"
arrow-schema = "53"
aws-config = "1"
aws-sdk-s3 = "1"
jsonschema = "0.18"
parquet = { version = "53", features = ["arrow"] }
zmq = "0.10"
rand = "0.8"
rand_chacha = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
